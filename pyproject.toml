# Links to guides, specs, and templates.
# https://packaging.python.org/en/latest/tutorials/packaging-projects/
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/
# https://packaging.python.org/en/latest/specifications/pyproject-toml/
# https://github.com/pypa/sampleproject

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"  # Mandatory.

[project]
dynamic = ["version"]
name = "vcams"
#TODO: consider description dynamic from vcams.__description__.
description = "A Program and Python Library for Voxel-Based Computer-Aided Modeling of Complex Structures"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}  # TODO: maybe just a license file?
authors = [{name = "Mohammadreza Khoshbin", email = "m.khoshbin@live.com" }]
maintainers = [{name = "Mohammadreza Khoshbin", email = "m.khoshbin@live.com" }]

keywords = ["abaqus", "cae", "fea", "fem",
    "finite-elements", "finite-element-analysis",
    "finite-element-method", "finite-element-mesh",
    "mesh-processing", "voxel", "gui",
    "mechanical-engineering", "scientific-research"]


# Valid classifiers: https://pypi.org/classifiers/
classifiers = [
    # Maturity
    "Development Status :: 5 - Production/Stable",
    # Intended Audience
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    # Topic
    "Topic :: Scientific/Engineering",
    # License
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    # Python Version
    "Programming Language :: Python :: 3.12",
    # Operating System
    "Operating System :: Microsoft :: Windows",
]

dependencies = [
  "numpy>=2.1.0",
  "scipy>=1.14.0",
  "scikit-image>=0.24.0",
  "matplotlib>=3.9.2",
  "tabulate2>=1.9.0",
  "PyQt5>=5.15.10",
]

# Additional dependancies installed when using
#   $ pip install vcams[dev]
[project.optional-dependencies]
dev = ["pyinstaller-versionfile>=2.1.1", "PyInstaller", "build",
    "sphinx", "sphinx-rtd-theme", "sphinx-autodoc-typehints"]

# Relevant URLs.
# List URLs that are  to your project
#
# This field corresponds to the "Project-URL" and "Home-Page" metadata fields:
# https://packaging.python.org/specifications/core-metadata/#project-url-multiple-use
# https://packaging.python.org/specifications/core-metadata/#home-page-optional
#
# Examples listed include a pattern for specifying where the package tracks
# issues, where the source is hosted, where to say thanks to the package
# maintainers, and where to support the project financially. The key is
# what's used to render the link text on PyPI.
# TODO: use the links in vcams.__init__.
[project.urls]
"Homepage" = "https://vcams.mkhoshbin.com/"  #  TODO: try assigning to Homepage variable
"Source" = "https://github.com/mkhoshbin1/vcams"
"Bug Reports" = "https://github.com/mkhoshbin1/vcams/issues"  #  TODO: try assigning to Issues variable

# Config for the `setuptools` build backend.
[tool.setuptools]
packages = ["vcams", "vcams.mask"]  # https://setuptools.pypa.io/en/latest/userguide/package_discovery.html

[tool.setuptools.dynamic]
version = {attr = "vcams.__version__"}